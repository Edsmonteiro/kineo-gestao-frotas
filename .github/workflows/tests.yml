name: Testes do Kineo

on:
  pull_request:
    branches:
      - hardening-v10
      - main
  push:
    branches:
      - test/8-regras-criticas-v11

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest

      - name: Verificar sintaxe
        run: python -m py_compile app.py database.py kineo_core.py
